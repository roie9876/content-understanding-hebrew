<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">InkSight layered document intelligence pipeline</title>
  <desc id="desc">Printed Hebrew and handwriting flow through separate analysis layers, evidence fusion, and a final overlay.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#202020" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b928b"/></marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c81e4b"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202020}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}.box-title{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202020}.box-copy{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}.box-title-light{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.box-copy-light{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ddd}.pill{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}.promise{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202020}
    </style>
  </defs>
  <rect width="1600" height="620" fill="#faf8f5"/>
  <text class="title" x="60" y="62">Read every layer</text>
  <text class="subtitle" x="60" y="96">Printed Hebrew and handwriting become one explainable document</text>
  <text x="340" y="148" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c81e4b">PRINTED LAYER</text>
  <text x="340" y="333" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#00897b">HANDWRITING DEEP DIVE</text>
  <g fill="none" stroke-width="2.5" marker-end="url(#arrow)"><path d="M250 325H290V205H340" stroke="#9b928b"/><path d="M250 325H290V390H340" stroke="#76a99c"/><path d="M570 390H650" stroke="#9b928b"/><path d="M570 390H610V515H650" stroke="#76a99c"/><path d="M575 205H940V335H980" stroke="#9b928b"/><path d="M885 365H930V350H980" stroke="#9b928b"/><path d="M885 515H930V385H980" stroke="#76a99c"/></g>
  <path d="M1215 365H1280" fill="none" stroke="#c81e4b" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="265" width="190" height="120" rx="8" fill="#fff" stroke="#c81e4b" stroke-width="2"/>
    <rect x="340" y="160" width="235" height="90" rx="8" fill="#f7f3ef" stroke="#d6cdc5" stroke-width="2"/>
    <rect x="340" y="345" width="230" height="90" rx="8" fill="#e9f4f1" stroke="#76a99c" stroke-width="2"/>
    <rect x="650" y="320" width="235" height="90" rx="8" fill="#f7f3ef" stroke="#d6cdc5" stroke-width="2"/>
    <rect x="650" y="470" width="235" height="90" rx="8" fill="#e9f4f1" stroke="#76a99c" stroke-width="2"/>
    <rect x="980" y="305" width="235" height="120" rx="8" fill="#fceef2" stroke="#d98aa2" stroke-width="2"/>
    <rect x="1280" y="305" width="250" height="120" rx="8" fill="#202020" stroke="#202020" stroke-width="2"/>
  </g>
  <g text-anchor="middle"><text class="box-title" x="155" y="315">Source document</text><text class="box-copy" x="155" y="344">PDF or image</text><text class="box-title" x="457" y="197">Content Understanding</text><text class="box-copy" x="457" y="225">Printed Hebrew + layout</text><text class="box-title" x="455" y="382">Detect + extract</text><text class="box-copy" x="455" y="410">Handwriting regions + crops</text><text class="box-title" x="767" y="357">Classical OCR</text><text class="box-copy" x="767" y="385">Ivrit · Kraken · future ML</text><text class="box-title" x="767" y="507">GPT-5.4 vision</text><text class="box-copy" x="767" y="535">Deep visual handwriting read</text><text class="box-title" x="1097" y="350">Evidence fusion</text><text class="box-copy" x="1097" y="378">Gate · compare · verify visually</text><text class="box-title-light" x="1405" y="350">Final result</text><text class="box-copy-light" x="1405" y="378">Overlay on original</text><text class="box-copy-light" x="1405" y="398">+ structured output</text></g>
